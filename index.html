<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행모아">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>여행모아</title>
<meta name="description" content="함께 쓰고, 한 권의 여행책으로">
<meta property="og:type" content="website">
<meta property="og:site_name" content="여행모아">
<meta property="og:title" content="여행모아">
<meta property="og:description" content="함께 쓰고, 한 권의 여행책으로. 초대받으셨다면 열어서 비밀번호를 넣어 주세요.">
<meta property="og:image" content="https://jongho88.github.io/tripbook/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#EEF1F6; --paper:#FFFFFF; --ink:#14213D; --ink2:#4E5A75; --ink3:#8A93A8;
  --line:#D9DFEA; --line2:#E9EDF4;
  --cobalt:#2340E0; --cobalt-d:#1A31B4; --cobalt-soft:#E7EBFE;
  --hl:#FFE45C; --red:#D93A3F;
  --sans:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-0.03em}
p{margin:0}
img{display:block;max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- masthead & chapter strip ---------- */
.mast{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.mast-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px 0}
.mast-title{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.strip{max-width:760px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px 12px 0}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;padding:8px 10px 11px;font-size:14px;color:var(--ink2);position:relative;white-space:nowrap}
.strip button .n{color:var(--cobalt);font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.strip button.on{color:var(--ink);font-weight:700}
.strip button .ic{width:15px;height:15px;margin-right:5px;vertical-align:-2px;stroke:var(--cobalt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strip button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--cobalt)}

/* ---------- page ---------- */
.page{max-width:760px;margin:0 auto;padding:28px 18px 120px}
.chap-head{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;margin:6px 0 22px}
.chap-num{font-size:64px;line-height:.82;font-weight:800;color:var(--cobalt);letter-spacing:-0.06em;font-variant-numeric:tabular-nums}
.chap-head h2{font-size:30px;font-weight:800}
.chap-head p{grid-column:1/-1;color:var(--ink2);margin-top:10px;max-width:36em}
.chap-head.plain{grid-template-columns:1fr}
.block{background:var(--paper);border-radius:20px;padding:20px;margin:14px 0;border:1px solid var(--line2)}
.block>h3{font-size:18px;font-weight:800;margin-bottom:12px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.faint{color:var(--ink3)}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{height:10px}
hr.rule{border:0;border-top:1px solid var(--line);margin:18px 0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--cobalt);color:#fff;transition:background .15s}
.btn:hover{background:var(--cobalt-d)}
.btn:disabled{opacity:.45;cursor:default}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.line:hover{background:var(--bg)}
.btn.quiet{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.quiet:hover{background:var(--bg)}
.btn.danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block-w{width:100%}
.link{color:var(--cobalt);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.in,.ta,.sel{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;min-height:44px}
.in:focus,.ta:focus,.sel:focus{border-color:var(--cobalt)}
.ta{min-height:96px;resize:vertical;line-height:1.6}
.lab{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.file{display:none}
.under{border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:6px 0;min-height:0;background:transparent;width:100%;outline:none;font-size:14px}
.under:focus{border-bottom-color:var(--cobalt)}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(20,33,61,.12)}

/* ---------- stickers (faces) ---------- */
.face{--c:var(--cobalt);width:var(--s,40px);height:var(--s,40px);border-radius:50%;flex:none;display:inline-grid;place-items:center;background:var(--c);color:#fff;font-weight:800;font-size:calc(var(--s,40px)*.42);border:calc(var(--s,40px)*.06) solid #fff;box-shadow:0 0 0 1.5px var(--c),0 3px 0 rgba(20,33,61,.14);overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover}
.faces{display:flex;flex-wrap:wrap;padding-left:10px}
.faces .face{margin-left:-10px}
.faces .face:nth-child(odd){transform:rotate(-5deg)}
.faces .face:nth-child(even){transform:rotate(4deg) translateY(4px)}

/* ---------- cover ---------- */
.cover-place{font-size:16px;font-weight:700;color:var(--cobalt);margin-bottom:6px}
.cover-title{font-size:clamp(44px,12.5vw,92px);font-weight:800;line-height:1.02;letter-spacing:-0.05em;margin:0 0 6px}
.cover-sub{font-size:18px;color:var(--ink2);margin-bottom:26px;max-width:28em}
.cover-faces{--s:66px;margin:6px 0 30px;padding-top:4px;position:relative}
.cover-faces .cf{position:relative;margin-left:-10px;padding:0;border-radius:50%;--rr:-5deg;--ty:0px;transform:translateY(var(--ty)) rotate(var(--rr));cursor:pointer}
.cover-faces .cf:nth-child(even){--rr:4deg;--ty:4px}
.cover-faces .cf .face{margin:0;transform:none}
.cover-faces.drop .cf{animation:cfDrop 1.4s cubic-bezier(.3,1.35,.5,1) both}
@keyframes cfDrop{0%{opacity:0;transform:translateY(-70px) rotate(-30deg) scale(1.3)}55%{opacity:1;transform:translateY(5px) rotate(var(--rr)) scale(.94)}78%{transform:translateY(-3px) rotate(var(--rr)) scale(1.03)}100%{transform:translateY(var(--ty)) rotate(var(--rr)) scale(1)}}
.cover-faces .cf.spin{animation:cfSpin .7s ease-out}
@keyframes cfSpin{0%{transform:translateY(var(--ty)) rotate(var(--rr))}50%{transform:translateY(-24px) rotate(200deg) scale(1.15)}100%{transform:translateY(var(--ty)) rotate(calc(var(--rr) + 360deg))}}
.cover-faces .cf.today::before{content:"";position:absolute;inset:0;border-radius:50%;animation:cfRing 1.8s ease-out infinite;pointer-events:none}
@keyframes cfRing{0%{box-shadow:0 0 0 0 rgba(35,64,224,.55)}100%{box-shadow:0 0 0 14px rgba(35,64,224,0)}}
.cover-faces .cf.today::after{content:"";position:absolute;right:0;top:0;width:14px;height:14px;border-radius:50%;background:var(--cobalt);border:2.5px solid #fff}
.cf-tip{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;z-index:2}
.cf-legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin:-20px 0 26px}
.cf-legend i{width:10px;height:10px;border-radius:50%;background:var(--cobalt);display:inline-block}
@media (prefers-reduced-motion:reduce){.cover-faces .cf{animation:none!important}.cover-faces .cf.today::before{animation:none;box-shadow:0 0 0 3px rgba(35,64,224,.45)}}
.cover-photo{border-radius:20px;overflow:hidden;margin:0 0 26px;aspect-ratio:16/10;background:var(--line2)}
.cover-photo img{width:100%;height:100%;object-fit:cover}

/* ticket */
.ticket{display:grid;grid-template-columns:1fr auto;background:#fff;border-radius:18px;border:1.5px solid var(--ink);position:relative;overflow:hidden}
.ticket .main{padding:16px 18px}
.ticket .stub{padding:16px 18px;border-left:2px dashed var(--line);display:grid;place-items:center;min-width:104px;text-align:center;position:relative}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink)}
.ticket .stub::before{top:-12px}
.ticket .stub::after{bottom:-12px}
.tk-k{font-size:12px;color:var(--ink3);font-weight:600}
.tk-v{font-size:17px;font-weight:800;letter-spacing:-0.02em}
.tk-grid{display:grid;grid-template-columns:repeat(3,auto);gap:4px 22px;justify-content:start}
.tk-big{font-size:30px;font-weight:800;letter-spacing:-0.04em;line-height:1;color:var(--cobalt)}

/* toc */
.toc{list-style:none;padding:0;margin:0}
.toc li button{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;gap:8px;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left}
.toc .n{font-weight:800;color:var(--cobalt);font-variant-numeric:tabular-nums}
.toc .t{font-weight:700;font-size:17px}
.toc .s{color:var(--ink2);font-size:14px}

/* stamp */
.stamp{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:50%;border:2.5px solid currentColor;color:var(--cobalt);font-weight:800;font-size:14px;transform:rotate(-12deg);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4.5px currentColor}
.stamp.off{color:var(--ink3)}
.stamp.wait{color:#C2780E}

/* ---------- people ---------- */
.people{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:640px){.people{grid-template-columns:1fr 1fr;column-gap:28px}}
.person{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line)}
.person .nm{font-size:20px;font-weight:800}
.person .rl{font-size:14px;color:var(--ink2)}
.person .hp{margin-top:6px;font-size:15px}
.person .hp.empty{color:var(--ink3)}
.person .act{margin-top:8px}

/* ---------- reorder ---------- */
.reorder{list-style:none;padding:0;margin:0}
.reorder li{display:grid;grid-template-columns:24px auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.reorder .n{font-weight:800;color:var(--cobalt);font-variant-numeric:tabular-nums;text-align:center}
.reorder b{font-size:17px}
.reorder .btn{min-width:44px}

/* ---------- prep ---------- */
.tlist{display:grid;gap:12px}
.tk-type{font-size:13px;font-weight:700;color:var(--cobalt)}
.tk-title{font-size:18px;font-weight:800;margin:2px 0 4px}
.tk-meta{font-size:14px;color:var(--ink2)}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.checks input[type=checkbox]{width:20px;height:20px;accent-color:var(--cobalt);flex:none}
.checks .done{color:var(--ink3);text-decoration:line-through}

/* ---------- plan ---------- */
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:none;width:62px;padding:8px 0;border-radius:14px;background:#fff;border:1.5px solid var(--line);text-align:center;line-height:1.2}
.dates button b{display:block;font-size:20px;font-weight:800}
.dates button span{font-size:12px;color:var(--ink2)}
.dates button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dates button.on span{color:#C9D0E0}
.tl{position:relative;margin:8px 0 0;padding-left:0;list-style:none}
.tl li{display:grid;grid-template-columns:58px 18px 1fr;gap:0 10px;padding-bottom:18px;position:relative}
.tl .tm{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);padding-top:1px;font-size:15px}
.tl .dot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--cobalt);margin-top:6px;position:relative;z-index:1}
.tl li:not(:last-child) .dot::after{content:"";position:absolute;left:50%;top:12px;width:2px;height:calc(100% + 60px);background:var(--line);transform:translateX(-50%);z-index:-1}
.tl .pl{font-weight:700;font-size:17px}
.tl .nt{font-size:14px;color:var(--ink2)}
.vote{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.vote .faces{--s:24px;padding-left:6px}
.vote .faces .face{margin-left:-6px;transform:none;box-shadow:0 0 0 1px var(--c)}
.like{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:#fff}
.like.on{border-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt)}
.like.no.on{border-color:var(--red);background:#FDECEC;color:var(--red)}
.vwho{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.vwho .faces{--s:22px;padding-left:6px}.vwho .faces .face{margin-left:-6px;transform:none;box-shadow:0 0 0 1px var(--c)}
.okb{display:inline-block;font-size:12px;font-weight:800;color:var(--cobalt);border:2px solid var(--cobalt);border-radius:999px;padding:0 8px;transform:rotate(-6deg)}
.tl .dot.ok{background:var(--cobalt)}
.tl li.cand .tm,.tl li.cand .pl,.tl li.cand .nt,.tl li.cand .faint{opacity:.45}.tl li.cand .dot{opacity:.5}

.tbox{position:relative;display:inline-block;flex:0 0 auto}
.tbox .in{width:140px}
.tbox .tph{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.tbox .in.has+.tph,.tbox .in:focus+.tph{display:none}
.tbox .in:not(.has):not(:focus)::-webkit-datetime-edit{color:transparent}
/* ---------- log ---------- */
.wx{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wx button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:12px;color:var(--ink);border:1.5px solid var(--line);background:#fff}
.wx button span{font-size:10.5px;color:var(--ink2);white-space:nowrap;letter-spacing:-.04em}
.wx button.on{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt)}
.wx button.on span{color:var(--cobalt);font-weight:700}
.wxi{display:inline-flex;align-items:center;gap:3px;color:var(--ink2);font-weight:500;font-size:13px;margin-left:6px;vertical-align:-3px}
.day-h{display:flex;align-items:baseline;gap:10px;margin:28px 0 6px}
.day-h b{font-size:22px;font-weight:800}
.day-h span{color:var(--ink2);font-size:14px}
.entry{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.entry .by{font-size:14px;font-weight:700}
.entry .tx{font-size:17px;line-height:1.7;white-space:pre-wrap;margin-top:2px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--line2)}
.ph.one{grid-template-columns:1fr}
.ph.one img{aspect-ratio:4/3}
.ph.two{grid-template-columns:1fr 1fr}

/* ---------- map ---------- */
.mapbox{position:relative;height:360px;border-radius:18px;overflow:hidden;background:#E3E8F0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border:1px solid var(--line)}
.mapbox .tiles,.mapbox .over{position:absolute;inset:0}
.mapbox .tiles img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.mapbox .pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(20,33,61,.45);cursor:pointer}
.mapbox .pin.last{width:24px;height:24px;margin:-12px 0 0 -12px}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mapbox .zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.mapbox .zoom button{width:36px;height:36px;border-radius:10px;background:#fff;box-shadow:0 1px 4px rgba(20,33,61,.25);font-size:20px;font-weight:700}
.mapbox .attr{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.85);font-size:10px;padding:2px 6px;border-top-left-radius:6px}
.mapbox .attr a{color:var(--ink2)}
.mapbox .pop{position:absolute;transform:translate(-50%,calc(-100% - 18px));background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 4px 14px rgba(20,33,61,.25);font-size:13px;white-space:nowrap;pointer-events:none}
.mapbox .empty-map{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:14px;text-align:center;padding:20px}
.recbtn{width:100%;min-height:56px;font-size:17px;border-radius:16px}
.locrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.locrow .tm{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.locrow .nm{font-weight:700}
.locrow .meta{font-size:12px;color:var(--ink3)}
.dchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0}
.dchips::-webkit-scrollbar{display:none}
.dchips button{flex:none;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px}
.dchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- album ---------- */
.ph-open{display:block;width:100%;padding:0;border-radius:10px;overflow:hidden;cursor:zoom-in}
.ph .ph-open{border-radius:8px}
.whochips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 2px;padding:2px}
.whochips::-webkit-scrollbar{display:none}
.whochips button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px}
.whochips button[data-aw="all"]{padding-left:12px}
.whochips button .face{--s:22px;border-width:1px;box-shadow:none}
.whochips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.viewer{position:fixed;inset:0;z-index:95;background:#0E1626;color:#fff;display:grid;grid-template-rows:auto 1fr auto}
.viewer .vtop{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.viewer .vcount{font-size:14px;color:#C9D0E0;font-variant-numeric:tabular-nums}
.viewer .vx{width:44px;height:44px;border-radius:50%;color:#fff;font-size:20px;background:rgba(255,255,255,.12)}
.viewer .vstage{display:grid;place-items:center;overflow:hidden;touch-action:pan-y;padding:0 4px}
.viewer .vstage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;font-size:40px;line-height:1;color:#fff;background:rgba(255,255,255,.08);border-radius:12px}
.viewer .vprev{left:8px}.viewer .vnext{right:8px}
@media (hover:none){.viewer .vnav{background:transparent;width:40px}}

<script>
'use strict';
/* =====================================================================

const APP_VERSION='11.16-표지사진';
const COLORS=['#2340E0','#D93A3F','#12A17D','#EE8A12','#8A4FD8','#0E9FC2','#D6458E','#6F7D1F'];
/* 날씨: 선 아이콘(24 격자). 예전 일기의 이모지 값도 읽어 들임 */
const WX=[
 {k:'sun',n:'맑음',e:'☀️',d:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>'},
 {k:'partly',n:'구름 조금',e:'⛅',d:'<path d="M8.5 4.5v1.4M3.6 9.4H5M4.9 5.8l1 1M13 5.8l-1 1"/><path d="M5.8 11.6A3.4 3.4 0 1 1 11.9 8"/><path d="M8.5 19.5h9a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6 1.4A2.8 2.8 0 0 0 8.5 19.5z"/>'},
 {k:'cloud',n:'흐림',e:'☁️',d:'<path d="M7 18.5h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.5 1.6A3.2 3.2 0 0 0 7 18.5z"/>'},
 {k:'rain',n:'비',e:'🌧️',d:'<path d="M7 14.5h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.5 1.6A3.2 3.2 0 0 0 7 14.5z"/><path d="M8.5 17.5l-1 2.5M12.5 17.5l-1 2.5M16.5 17.5l-1 2.5"/>'},
 {k:'storm',n:'뇌우',e:'⛈️',d:'<path d="M7 14.5h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.5 1.6A3.2 3.2 0 0 0 7 14.5z"/><path d="M12.8 14.5l-2.3 3.6h3l-2.3 3.6"/>'},
 {k:'snow',n:'눈',e:'❄️',d:'<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.8 4.8L12 6.6l2.2-1.8M9.8 19.2L12 17.4l2.2 1.8"/>'},
 {k:'fog',n:'안개',e:'🌫️',d:'<path d="M4 9h16M6 13h12M4 17h16"/><path d="M7 5.5h10"/>'}];
const wxFind=v=>v?WX.find(w=>w.k===v||w.e===v||w.e.replace('\uFE0F','')===String(v).replace('\uFE0F','')):null;
const wxSvg=(w,sz=26,col='currentColor')=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${w.d}</svg>`;
const wxInline=v=>{const w=wxFind(v);return w?`<span class="wxi">${wxSvg(w,18)}${w.n}</span>`:''};
const wxPicker=(sel,attr='')=>`<div class="wx" role="group" aria-label="날씨" ${attr}>${WX.map(w=>`<button type="button" data-w="${w.k}" class="${wxFind(sel)?.k===w.k?'on':''}" aria-pressed="${wxFind(sel)?.k===w.k}">${wxSvg(w)}<span>${w.n}</span></button>`).join('')}</div>`;
const PREP={stay:'숙박',flight:'항공',car:'렌트카',etc:'기타'};
const PREPD={stay:['체크인','체크아웃'],flight:['가는 날','오는 날'],car:['픽업','반납'],etc:['시작','끝']};
function prepRange(p,full){if(!p.date)return '';const f=d=>full?d.replace(/-/g,'. '):d.slice(5).replace('-','.');
  if(!p.date2||p.date2===p.date)return f(p.date);const n=Math.round((new Date(p.date2)-new Date(p.date))/864e5);
  return `${f(p.date)} – ${f(p.date2)}${p.type==='stay'&&n>0?` (${n}박)`:n>0?` (${n+1}일)`:''}`}
const REFLQ=[['moment','가장 기억에 남는 순간'],['surprise','예상과 달랐던 것'],['thanks','함께한 사람들에게'],['next','다음에 함께 가고 싶은 곳'],['free','하고 싶은 말']];
const CHAPS=[
  {k:'cover',t:'표지'},
  {k:'people',n:1,t:'사람들'},
  {k:'prep',n:2,t:'준비'},
  {k:'plan',n:3,t:'계획'},
  {k:'log',n:4,t:'여행일기'},
  {k:'map',n:5,t:'위치기록'},
  {k:'album',n:6,t:'앨범'},
  {k:'refl',n:7,t:'뒤돌아보기'},
  {k:'book',t:'책 만들기',ic:'book'},
  {k:'money',t:'정산',ic:'money'}
];

const NAVIC={
  book:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  money:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  share:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M19 8v6M16 11h6"/></svg>'};
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(n=10)=>{const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s};
const CURRENCIES=[['USD','미국 달러'],['CAD','캐나다 달러'],['KRW','한국 원'],['EUR','유로'],['GBP','영국 파운드'],['JPY','일본 엔'],['MXN','멕시코 페소'],['AUD','호주 달러']];
const curCode=()=>{const c=(typeof meta==='function'&&meta().currency)||'USD';return CURRENCIES.some(x=>x[0]===c)?c:'USD'};
const curDigits=()=>{try{return new Intl.NumberFormat('en',{style:'currency',currency:curCode()}).resolvedOptions().maximumFractionDigits}catch(e){return 2}};
const roundCur=n=>{const k=Math.pow(10,curDigits());return Math.round((Number(n)||0)*k)/k};
const curSymbol=()=>{try{return new Intl.NumberFormat('ko-KR',{style:'currency',currency:curCode()}).formatToParts(0).find(x=>x.type==='currency').value}catch(e){return curCode()}};
const won=n=>{const d=curDigits();try{return new Intl.NumberFormat('ko-KR',{style:'currency',currency:curCode(),minimumFractionDigits:d,maximumFractionDigits:d}).format(roundCur(n))}catch(e){return roundCur(n).toLocaleString('ko-KR')+' '+curCode()}};
const curSelect=(id)=>`<select class="sel" id="${id}" data-f="trip/meta/currency" data-rerender="1" aria-label="통화">${CURRENCIES.map(([c,n])=>{let sym=c;try{sym=new Intl.NumberFormat('ko-KR',{style:'currency',currency:c}).formatToParts(0).find(x=>x.type==='currency').value}catch(e){}return `<option value="${c}" ${curCode()===c?'selected':''}>${n} (${sym})</option>`}).join('')}</select>`;
const LS={get(k,d=null){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(m,ms=2400){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}

/* ---------------------------------------------------------------
   저장소 (backend)
   --------------------------------------------------------------- */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('urtripbook',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('rows',{keyPath:'k'});d.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbDo(store,mode,fn){return idbOpen().then(d=>new Promise((res,rej)=>{const tx=d.transaction(store,mode);const st=tx.objectStore(store);let out;Promise.resolve(fn(st)).then(v=>out=v);tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}))}
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

const LocalBackend={
  kind:'local',blobUrls:{},
  async load(){
    const rows=await idbDo('rows','readonly',st=>reqP(st.getAll()));
    await idbDo('blobs','readonly',st=>new Promise(res=>{const c=st.openCursor();c.onsuccess=()=>{const cur=c.result;if(!cur)return res();this.blobUrls[cur.key]=URL.createObjectURL(cur.value);cur.continue()}}));
    return rows;
  },
  async upsert(rows){await idbDo('rows','readwrite',st=>{rows.forEach(r=>st.put(r))})},
  async since(){return []},
  async putBlob(path,blob){await idbDo('blobs','readwrite',st=>{st.put(blob,path)});this.blobUrls[path]=URL.createObjectURL(blob)},
  async delBlob(path){await idbDo('blobs','readwrite',st=>{st.delete(path)});delete this.blobUrls[path]},
  url(path){return this.blobUrls[path]||''},
  async getBlob(path){return idbDo('blobs','readonly',st=>reqP(st.get(path)))},
  async wipe(){await idbDo('rows','readwrite',st=>{st.clear()});await idbDo('blobs','readwrite',st=>{st.clear()});this.blobUrls={}}
};

/* 비밀번호 → 열쇠. 열쇠 자체는 서버에 저장되지 않고, 서버는 열쇠의 해시만 비교한다 */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function sha256hex(t){return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))}
async function deriveTrip(pw,salt){
  if(!crypto.subtle)throw new Error('이 브라우저는 암호 기능을 지원하지 않아요. https 주소로 열어 주세요');
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw.normalize('NFC').trim()),'PBKDF2',false,['deriveBits']);
  const tripKey=hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('urtripbook:'+salt),iterations:210000,hash:'SHA-256'},base,256));
  return {tripKey,trip:await sha256hex(tripKey),folder:(await sha256hex('photo:'+tripKey)).slice(0,32)};
}

async function deriveAdmin(pw,salt){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw.normalize('NFC').trim()),'PBKDF2',false,['deriveBits']);
  const adminKey=hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('urtripbook-admin:'+salt),iterations:210000,hash:'SHA-256'},base,256));
  return {adminKey,adminHash:await sha256hex(adminKey)};
}

function RemoteBackend(cfg){
  const base=cfg.url.replace(/\/+$/,''), key=cfg.key, trip=cfg.trip, tk=cfg.tripKey||'';
  const H=()=>{const h={apikey:key,'x-trip-key':tk};if(cfg.adminKey)h['x-admin-key']=cfg.adminKey;if(!/^sb_/.test(key))h.Authorization='Bearer '+key;return h};
  async function rq(path,opt={}){
    const r=await fetch(base+path,{...opt,headers:{...H(),...(opt.headers||{})}});
    if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error(r.status+' '+t.slice(0,200))}
    return r;
  }
  const toRow=x=>({k:x.col+':'+x.id,col:x.col,id:x.id,data:x.data||{},t:Number(x.updated_at)||0,del:!!x.deleted,s:Date.parse(x.server_at)||0});
  return {
    kind:'remote',cfg,
    async ping(){await rq(`/rest/v1/tripbook_records?select=id&limit=1`);return true},
    async isAdmin(adminKey){const r=await rq(`/rest/v1/rpc/tripbook_is_admin`,{method:'POST',headers:{'Content-Type':'application/json',...(adminKey?{'x-admin-key':adminKey}:{})},body:'{}'});return (await r.json())===true},
    async setAdmin(newHash){await rq(`/rest/v1/rpc/tripbook_set_admin`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_hash:newHash})})},
    async hasTrip(){const r=await rq(`/rest/v1/tripbook_records?select=id&trip=eq.${trip}&col=eq.trip&id=eq.meta`);return (await r.json()).length>0},
    async load(){
      const out=[];for(let off=0;;off+=1000){
        const r=await rq(`/rest/v1/tripbook_records?select=*&trip=eq.${trip}&order=server_at.asc&limit=1000&offset=${off}`);
        const a=await r.json();out.push(...a.map(toRow));if(a.length<1000)break;
      }return out;
    },
    async since(ms){
      const iso=new Date(Math.max(0,ms-8000)).toISOString();
      const r=await rq(`/rest/v1/tripbook_records?select=*&trip=eq.${trip}&server_at=gt.${encodeURIComponent(iso)}&order=server_at.asc&limit=1000`);
      return (await r.json()).map(toRow);
    },
    async upsert(rows){
      if(!rows.length)return;
      await rq(`/rest/v1/tripbook_records?on_conflict=trip,col,id`,{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.map(r=>({trip,col:r.col,id:r.id,data:r.data,updated_at:r.t,deleted:!!r.del})))});
    },
    async putBlob(path,blob){await rq(`/storage/v1/object/tripbook/${path}`,{method:'POST',headers:{'Content-Type':blob.type||'application/octet-stream','cache-control':'31536000'},body:blob})},
    async delBlob(path){try{await rq(`/storage/v1/object/tripbook`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefixes:[path]})})}catch(e){console.warn(e)}},
    url(path){return path?`${base}/storage/v1/object/public/tripbook/${path}`:''},
    async getBlob(path){const r=await fetch(this.url(path));if(!r.ok)throw new Error('사진을 받지 못했어요');return r.blob()},
    async wipe(paths,onp=()=>{}){
      let removed=0;
      for(let i=0;i<paths.length;i+=100){
        const part=paths.slice(i,i+100);
        try{const r=await rq(`/storage/v1/object/tripbook`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefixes:part})});const a=await r.json().catch(()=>[]);removed+=Array.isArray(a)?a.length:0}catch(e){console.warn(e)}
        onp(.1+.6*Math.min(1,(i+100)/paths.length),`사진 ${Math.min(paths.length,i+100)}/${paths.length}장 삭제`);
      }
      await rq(`/rest/v1/tripbook_records?trip=eq.${trip}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});
      onp(1,'모두 삭제했어요');
      return {photos:paths.length,removed};
    }
  };
}

let BE=null;                        // backend

let lastServer=0, syncState='off', syncTimer=null;
const outboxKey=()=>'tb.outbox.'+(cfg?.trip||'local');

const all=col=>{const o=[];rows.forEach(r=>{if(r.col===col&&!r.del)o.push({id:r.id,...r.data,_t:r.t})});return o};
const one=(col,id)=>{const r=rows.get(col+':'+id);return r&&!r.del?{id,...r.data}:null};
const meta=()=>one('trip','meta')||{};
const members=()=>all('member').sort((a,b)=>(a.order||0)-(b.order||0)||a._t-b._t);

async function put(col,id,data,{silent=false}={}){
  const r={k:col+':'+id,col,id,data,t:Date.now(),del:false,s:0};
  rows.set(r.k,r);await persist([r]);if(!silent)render();
}
async function patch(col,id,p,opt){const cur=one(col,id)||{};const d={...cur,...p};delete d.id;delete d._t;return put(col,id,d,opt)}
async function remove(col,id){const r={k:col+':'+id,col,id,data:{},t:Date.now(),del:true,s:0};rows.set(r.k,r);await persist([r]);render()}
async function persist(rs){
  if(BE.kind==='local'){await BE.upsert(rs);return}
  const ob=LS.get(outboxKey(),{});rs.forEach(r=>ob[r.k]=r);LS.set(outboxKey(),ob);cacheSave();
  flush();
}
let flushing=false;
async function flush(){
  if(!BE||BE.kind!=='remote'||flushing)return;
  const ob=LS.get(outboxKey(),{});const list=Object.values(ob);if(!list.length){setSync('ok');return}
  flushing=true;let ok=false;
  try{await BE.upsert(list);const now=LS.get(outboxKey(),{});list.forEach(r=>{if(now[r.k]&&now[r.k].t===r.t)delete now[r.k]});LS.set(outboxKey(),now);setSync('ok');ok=true}
  catch(e){console.warn(e);setSync('err')}
  finally{flushing=false}
  if(ok&&Object.keys(LS.get(outboxKey(),{})).length)setTimeout(flush,30);
}
function cacheSave(){if(BE?.kind!=='remote')return;clearTimeout(cacheSave._h);cacheSave._h=setTimeout(()=>LS.set('tb.cache.'+cfg.trip,{rows:[...rows.values()],last:lastServer}),400)}
function applyRemote(list){
  let changed=false;const ob=LS.get(outboxKey(),{});
  for(const r of list){
    if(r.s>lastServer)lastServer=r.s;
    if(ob[r.k])continue; // 내가 아직 보내지 못한 수정이 우선
    const cur=rows.get(r.k);
    if(!cur||cur.t!==r.t||cur.del!==r.del||JSON.stringify(cur.data)!==JSON.stringify(r.data)){rows.set(r.k,r);changed=true}
  }
  if(changed)cacheSave();
  return changed;
}
async function pull(){
  if(!BE||BE.kind!=='remote')return;
  try{await flush();const ch=applyRemote(await BE.since(lastServer));setSync(LS.get(outboxKey(),{})&&Object.keys(LS.get(outboxKey(),{})).length?'err':'ok');if(ch)scheduleRender()}
  catch(e){console.warn(e);setSync('err')}
}
function setSync(s){syncState=s;const el=$('#syncDot');if(el){el.className='sync '+(s==='ok'?'':s==='err'?'err':'off');el.lastChild.textContent=s==='ok'?' 함께 쓰는 중':s==='err'?' 연결 끊김, 다시 시도 중':' 이 기기에만 저장'}}
function scheduleRender(){
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#view')?.contains(a)){renderPending=true;return}
  if($('#modal').innerHTML){renderPending=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(renderPending)setTimeout(()=>{if(renderPending&&!$('#modal').innerHTML){renderPending=false;render()}},120)});

const WD='일월화수목금토';
function days(){
  const m=meta();if(!m.start)return[];
  const s=new Date(m.start+'T00:00:00'),e=new Date((m.end||m.start)+'T00:00:00');const out=[];
  for(let d=new Date(s),i=0;d<=e&&i<45;d.setDate(d.getDate()+1),i++)out.push({i,date:new Date(d),md:`${d.getMonth()+1}.${d.getDate()}`,wd:WD[d.getDay()]});
  return out;
}
function todayIdx(){const t=new Date();t.setHours(0,0,0,0);const i=days().findIndex(d=>d.date.getTime()===t.getTime());return i}
function dayName(i){const d=days()[i];return d?`${i+1}일째`:`${(i??0)+1}일째`}
function dayFull(i){const d=days()[i];return d?`${i+1}일째, ${d.md} ${d.wd}요일`:dayName(i)}
function status(){
  const ds=days();if(!ds.length)return{big:'날짜 미정',small:'기간을 정해 주세요'};
  const t=new Date();t.setHours(0,0,0,0);const s=ds[0].date,e=ds[ds.length-1].date;
  if(t<s){const n=Math.round((s-t)/864e5);return{big:'D-'+n,small:'출발까지'}}
  if(t>e)return{big:'완료',small:'다녀왔어요'};
  return{big:(todayIdx()+1)+'일째',small:'여행 중'};
}

const fileURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('사진을 열지 못했어요'));i.src=src});
async function shrink(file,max=1600,q=.82){
  const img=await loadImg(await fileURL(file));const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',q));
}
async function savePhoto(blob){
  const id=uid(12);const path=`${cfg.mode==='remote'?cfg.folder:'local'}/${id}.jpg`;
  await BE.putBlob(path,blob);
  /* 올린 사진 목록: 바꾸거나 다시 자른 사진도 마지막 「온라인 기록 지우기」 때 빠짐없이 지우려고 */
  try{await put('blob',id,{path},{silent:true})}catch(e){console.warn(e)}
  return{id,path};
}
async function addPhotos(files,extra){
  const ids=[];let i=0;
  for(const f of files){
    if(!f.type.startsWith('image/')){toast('영상은 다음 단계에서 추가됩니다. 사진만 올렸어요');continue}
    i++;toast(`사진 올리는 중 ${i}/${files.length}`,8000);
    try{const b=await shrink(f);const {id,path}=await savePhoto(b);await put('media',id,{path,caption:'',author:myId,created:Date.now(),...extra},{silent:true});ids.push(id)}
    catch(e){console.error(e);toast('사진을 올리지 못했어요. 인터넷 연결을 확인해 주세요');break}
  }
  return ids;
}

const SQL=`-- 여행모아: Supabase SQL Editor에 붙여넣고 Run
-- 이미 쓰고 있는 프로젝트에 넣어도 됩니다. 이름이 모두 tripbook_ 으로 시작해서
-- 기존 표·사진 보관함·규칙은 건드리지 않습니다.
create table if not exists public.tripbook_records (
  trip text not null,
  col text not null,
  id text not null,
  data jsonb,
  updated_at bigint,
  deleted boolean default false,
  server_at timestamptz not null default now(),
  primary key (trip, col, id)
);
create or replace function public.tripbook_touch() returns trigger
language plpgsql as $$ begin new.server_at := now(); return new; end $$;
drop trigger if exists tripbook_touch on public.tripbook_records;
create trigger tripbook_touch before insert or update on public.tripbook_records
  for each row execute function public.tripbook_touch();

-- 비밀번호에서 만든 열쇠(x-trip-key)가 맞아야만 읽고 쓸 수 있음
create or replace function public.tripbook_key_hash(p text) returns text
language sql stable as $$
  select encode(sha256(convert_to(p || coalesce(current_setting('request.headers', true)::json ->> 'x-trip-key', ''), 'UTF8')), 'hex')
$$;

-- 관리자: 관리자 비밀번호에서 만든 열쇠(x-admin-key)의 해시만 보관. 앱에서 직접 읽을 수 없음
create table if not exists public.tripbook_admins (
  trip text primary key,
  admin_hash text not null
);
alter table public.tripbook_admins enable row level security;
revoke all on public.tripbook_admins from anon;

create or replace function public.tripbook_is_admin() returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from public.tripbook_admins
    where trip = public.tripbook_key_hash('')
      and admin_hash = encode(sha256(convert_to(coalesce(current_setting('request.headers', true)::json ->> 'x-admin-key', ''), 'UTF8')), 'hex'))
$$;

create or replace function public.tripbook_set_admin(new_hash text) returns void
language plpgsql security definer set search_path = public as $$
declare t text := public.tripbook_key_hash('');
begin
  if length(coalesce(new_hash, '')) <> 64 then raise exception 'bad hash'; end if;
  if not exists (select 1 from public.tripbook_records where trip = t and col = 'trip' and id = 'meta') then
    raise exception 'unknown trip';
  end if;
  if exists (select 1 from public.tripbook_admins where trip = t) then
    if not public.tripbook_is_admin() then raise exception 'not admin'; end if;
    update public.tripbook_admins set admin_hash = new_hash where trip = t;
  else
    insert into public.tripbook_admins (trip, admin_hash) values (t, new_hash);
  end if;
end $$;
grant execute on function public.tripbook_is_admin() to anon;
grant execute on function public.tripbook_set_admin(text) to anon;

-- 글: 입장 비밀번호로 읽고 쓰기, 진짜 삭제는 관리자만

grant select, insert, update, delete on public.tripbook_records to anon;
drop policy if exists "tripbook_key" on public.tripbook_records;
drop policy if exists "tripbook_read" on public.tripbook_records;
drop policy if exists "tripbook_ins" on public.tripbook_records;
drop policy if exists "tripbook_upd" on public.tripbook_records;
drop policy if exists "tripbook_del" on public.tripbook_records;
create policy "tripbook_read" on public.tripbook_records for select to anon
  using (trip = public.tripbook_key_hash(''));
create policy "tripbook_ins" on public.tripbook_records for insert to anon
  with check (trip = public.tripbook_key_hash(''));
create policy "tripbook_upd" on public.tripbook_records for update to anon

/* 초대 링크에는 저장 공간 주소와 공개 키, 여행별 소금(salt)만 들어간다. 비밀번호 없이는 아무것도 열 수 없다 */
function joinParam(){return btoa(unescape(encodeURIComponent(JSON.stringify({u:cfg.url,k:cfg.key,s:cfg.salt,n:meta().title||cfg.title||''})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function inviteLink(){return location.origin+location.pathname+'?j='+joinParam()}
/* 초대 정보를 주소창(?j=)에 남겨 둔다: 아이폰 '홈 화면에 추가'는 저장소가 따로라서, 홈 화면 앱이 이 주소로 열리면 비밀번호만 다시 물어본다 */
function keepJoinInUrl(){if(cfg?.mode==='remote'){try{history.replaceState(null,'',location.pathname+'?j='+joinParam()+location.hash)}catch(e){}}}
function clearJoinFromUrl(){try{history.replaceState(null,'',location.pathname)}catch(e){}}
function parseJoin(str){
  const m=String(str||'').match(/[?&#]j(?:oin)?=([A-Za-z0-9_\-]+)/)||String(str||'').match(/#join=([A-Za-z0-9_\-]+)/);if(!m)return null;
  try{const x=m[1].replace(/-/g,'+').replace(/_/g,'/');const o=JSON.parse(decodeURIComponent(escape(atob(x+'==='.slice((x.length+3)%4)))));if(o.u&&o.k&&o.s)return{url:o.u,key:o.k,salt:o.s,title:o.n||''}}catch(e){console.warn(e)}
  return null;
}
function readJoin(){
  const j=parseJoin(location.search)||parseJoin(location.hash);if(!j)return false;
  const cur=LS.get('tb.cfg');
  if(!(cur&&cur.mode==='remote'&&cur.salt===j.salt))LS.set('tb.join',j);
  if(location.hash.startsWith('#join=')){try{history.replaceState(null,'',location.pathname+'?'+location.hash.slice(1).replace(/^join=/,'j='))}catch(e){}view='cover'}
  return true;
}

/* 표지 사진: 16:10 틀에 맞춰 끌어서 위치, 슬라이더나 두 손가락으로 크기 */
async function coverCrop(blob,prev,isNew){
  const url=URL.createObjectURL(blob);let img;try{img=await loadImg(url)}catch(e){toast(e.message);return}
  const W=img.naturalWidth,H=img.naturalHeight,R=16/10;
  const maxW=Math.min(W,H*R);              /* 틀에 꽉 차는 가장 큰 잘라내기 폭 */
  let c=prev&&prev.w?{...prev}:{w:maxW,x:W/2,y:H/2};
  const clamp=()=>{c.w=Math.max(maxW*.25,Math.min(maxW,c.w));const h=c.w/R;c.x=Math.min(W-c.w/2,Math.max(c.w/2,c.x));c.y=Math.min(H-h/2,Math.max(h/2,c.y))};clamp();
  const zv=()=>Math.round((1-c.w/maxW)/.75*100);
  openSheet(`<h2>표지 사진 맞추기</h2><p class="muted small" style="margin:6px 0 12px">사진을 끌어서 위치를 잡고, 아래 막대나 두 손가락으로 크기를 바꿔 주세요.</p>
    <canvas id="ccv" width="800" height="500" style="width:100%;aspect-ratio:16/10;border-radius:16px;touch-action:none;cursor:grab;background:var(--line2);display:block" aria-label="표지 사진 맞추기"></canvas>
    <div class="row" style="margin-top:14px;gap:10px"><span class="small muted">작게</span><input type="range" id="ccz" min="0" max="100" value="${zv()}" class="grow" style="accent-color:var(--cobalt)" aria-label="사진 크기"><span class="small muted">크게</span></div>
    <div class="sp"></div><div class="row"><button class="btn grow" id="ccOk">이대로 저장</button><button class="btn quiet" id="ccNo">취소</button></div>`);
  const cv=$('#ccv'),cx=cv.getContext('2d');
  const draw=()=>{const h=c.w/R;cx.clearRect(0,0,800,500);cx.drawImage(img,c.x-c.w/2,c.y-h/2,c.w,h,0,0,800,500);
    cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=1.5;cx.beginPath();for(const t of [1/3,2/3]){cx.moveTo(800*t,0);cx.lineTo(800*t,500);cx.moveTo(0,500*t);cx.lineTo(800,500*t)}cx.stroke()};
  draw();
  $('#ccz').oninput=e=>{c.w=maxW*(1-Number(e.target.value)/100*.75);clamp();draw()};
  const pts=new Map();let start=null;
  const k=()=>c.w/cv.getBoundingClientRect().width;
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.style.cursor='grabbing';
    const a=[...pts.values()];start={c:{...c},a:a.map(p=>({...p})),d:a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0}};
  cv.onpointermove=e=>{if(!pts.has(e.pointerId)||!start)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pts.values()];
    if(a.length>1&&start.d){const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);c.w=start.c.w*start.d/d}
    else{const s=start.c.w/cv.getBoundingClientRect().width;c.x=start.c.x-(a[0].x-start.a[0].x)*s;c.y=start.c.y-(a[0].y-start.a[0].y)*s}
    clamp();$('#ccz').value=zv();draw()};
  cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);cv.style.cursor='grab';const a=[...pts.values()];start=a.length?{c:{...c},a:a.map(p=>({...p})),d:0}:null};
  cv.onwheel=e=>{e.preventDefault();c.w*=e.deltaY>0?1.06:1/1.06;clamp();$('#ccz').value=zv();draw()};
  $('#ccNo').onclick=()=>{closeSheet();URL.revokeObjectURL(url)};
  $('#ccOk').onclick=async()=>{$('#ccOk').disabled=true;toast('표지 사진 저장 중…',8000);
    try{const out=document.createElement('canvas');out.width=1600;out.height=1000;const h=c.w/R;out.getContext('2d').drawImage(img,c.x-c.w/2,c.y-h/2,c.w,h,0,0,1600,1000);
      const cut=await new Promise(r=>out.toBlob(r,'image/jpeg',.86));const d={cover:(await savePhoto(cut)).path,coverCrop:{x:Math.round(c.x),y:Math.round(c.y),w:Math.round(c.w)}};
      if(isNew){d.coverOrig=(await savePhoto(blob)).path;d.coverBy=myId||null}
      closeSheet();URL.revokeObjectURL(url);await patch('trip','meta',d);toast('표지 사진을 맞췄어요')}
    catch(err){$('#ccOk').disabled=false;toast('저장하지 못했어요: '+err.message)}};
}

let peopleReorder=false;

      [ids[k],ids[t]]=[ids[t],ids[k]];

      render();const btn=$(`[data-mv="${t}"][data-d="${d}"]`)||$(`[data-mv="${t}"]`);btn?.focus();

    <div class="people" style="margin-top:8px">${ms.map(m=>`<div class="person">${face(m,76)}<div>
      <div class="nm" style="color:${mcol(m)}">${esc(m.name)}</div><div class="rl">${esc(m.role||'역할 미정')}</div>
      <p class="hp ${m.hope?'':'empty'}">${m.hope?esc(m.hope):'이번 여행에서 기대하는 것을 적어 주세요'}</p>
      <div class="act"><button class="btn quiet sm" data-ed="${m.id}">${m.id===myId?'내 소개 쓰기':'고치기'}</button></div></div></div>`).join('')}</div>
    ${ms.length?'':'<div class="empty"><b>아직 아무도 없어요</b>함께 가는 사람의 이름을 하나씩 추가해 주세요.</div>'}`;

function editPerson(id){
  const m=member(id);let color=mcol(m),img=null,crop=null,changed=false;
  openSheet(`<h2>${esc(m.name)}</h2>
    <label class="lab">얼굴 사진</label>
    <div class="caric"><canvas id="cv" width="440" height="440" style="touch-action:none;cursor:grab" aria-label="얼굴 사진 미리 보기"></canvas>
      <div style="flex:1;min-width:150px"><label class="btn line sm">사진 고르기<input type="file" class="file" accept="image/*" id="cvF"></label>
      <div id="zoomBox" style="display:none;margin-top:12px"><label class="lab" for="cvZ" style="margin-top:0">크기</label><input type="range" id="cvZ" min="0" max="100" value="35" style="width:100%;accent-color:var(--cobalt)">
      <p class="small muted" style="margin-top:4px">사진을 손가락이나 마우스로 끌어서 얼굴을 동그라미 가운데에 맞춰 주세요.</p></div></div></div>
    <label class="lab">내 색</label><div class="row" id="cols">${COLORS.map(c=>`<button aria-label="색 ${c}" data-c="${c}" style="width:32px;height:32px;border-radius:50%;background:${c};box-shadow:${c===color?'0 0 0 3px #fff,0 0 0 5px '+c:'none'}"></button>`).join('')}</div>
    <label class="lab" for="eN">이름</label><input class="in" id="eN" value="${esc(m.name)}">
    <label class="lab" for="eR">역할</label><input class="in" id="eR" value="${esc(m.role||'')}" placeholder="예: 운전, 사진, 맛집, 길 찾기 담당">
    <label class="lab" for="eH">이번 여행에서 기대하는 것</label><textarea class="ta" id="eH" style="min-height:70px">${esc(m.hope||'')}</textarea>
    <div class="sp"></div><div class="row"><button class="btn grow" id="eSave">저장</button><button class="btn quiet" id="eNo">닫기</button></div>
    <div style="margin-top:18px" class="row">${canDel(m.by)?'<button class="btn danger sm" id="eDel">참가자에서 빼기</button>':''}${m.avatar&&(canDel(m.by)||m.id===myId)?'<button class="btn quiet sm" id="eNoPic">사진 빼기</button>':''}</div>`);
  const cv=$('#cv'),cx=cv.getContext('2d'),S=440;
  const ring=()=>{cx.save();cx.globalCompositeOperation='destination-in';cx.beginPath();cx.arc(S/2,S/2,S/2,0,7);cx.fill();cx.restore();cx.lineWidth=14;cx.strokeStyle=color;cx.beginPath();cx.arc(S/2,S/2,S/2-7,0,7);cx.stroke()};
  const draw=()=>{
    cx.clearRect(0,0,S,S);
    if(img&&crop){cx.drawImage(img,crop.x-crop.side/2,crop.y-crop.side/2,crop.side,crop.side,0,0,S,S);ring();return}
    if(m.avatar&&!changed){loadImg(mediaUrl(m.avatar)).then(i=>{if(img)return;cx.clearRect(0,0,S,S);cx.drawImage(i,0,0,S,S);ring()}).catch(()=>{});return}
    cx.fillStyle=color;cx.beginPath();cx.arc(S/2,S/2,S/2,0,7);cx.fill();cx.fillStyle='#fff';cx.font='800 170px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(m.name[0],S/2,S/2+12);
  };
  draw();
  const W=()=>img.naturalWidth,H=()=>img.naturalHeight;
  const clamp=()=>{const mx=Math.min(W(),H());crop.side=Math.max(mx*.2,Math.min(mx,crop.side));crop.x=Math.min(W()-crop.side/2,Math.max(crop.side/2,crop.x));crop.y=Math.min(H()-crop.side/2,Math.max(crop.side/2,crop.y))};
  const zoomToSide=z=>Math.min(W(),H())*(1-z/100*.8);
  $('#cvF').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{img=await loadImg(await fileURL(f))}catch(err){toast(err.message);return}
    changed=true;const z=Number($('#cvZ').value);crop={x:W()/2,y:H()*.45,side:zoomToSide(z)};clamp();$('#zoomBox').style.display='';draw()};
  $('#cvZ').oninput=e=>{if(!crop)return;crop.side=zoomToSide(Number(e.target.value));clamp();draw()};
  let drag=null;
  cv.onpointerdown=e=>{if(!crop)return;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';drag={x:e.clientX,y:e.clientY,cx:crop.x,cy:crop.y}};
  cv.onpointermove=e=>{if(!drag)return;const k=crop.side/cv.getBoundingClientRect().width;crop.x=drag.cx-(e.clientX-drag.x)*k;crop.y=drag.cy-(e.clientY-drag.y)*k;clamp();draw()};
  cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab'};
  $$('#cols button').forEach(b=>b.onclick=()=>{color=b.dataset.c;$$('#cols button').forEach(x=>x.style.boxShadow=x===b?`0 0 0 3px #fff,0 0 0 5px ${x.dataset.c}`:'none');draw()});
  $('#eNo').onclick=closeSheet;
  const ed=$('#eDel');if(ed)ed.onclick=()=>{closeSheet();ask(`${m.name} 님을 참가자에서 뺄까요?`,'빼기',()=>remove('member',id))};
  const np=$('#eNoPic');if(np)np.onclick=async()=>{closeSheet();await patch('member',id,{avatar:null});toast('사진을 뺐어요')};
  $('#eSave').onclick=async()=>{
    $('#eSave').disabled=true;
    try{const d={name:$('#eN').value.trim()||m.name,role:$('#eR').value.trim(),hope:$('#eH').value.trim(),color};
      if(img&&crop){const c=document.createElement('canvas');c.width=c.height=400;c.getContext('2d').drawImage(img,crop.x-crop.side/2,crop.y-crop.side/2,crop.side,crop.side,0,0,400,400);
        const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));const {path}=await savePhoto(blob);d.avatar=path}
      closeSheet();await patch('member',id,d);toast('저장했어요')}catch(e){$('#eSave').disabled=false;toast('저장하지 못했어요: '+e.message)}
  };
}

function editPrep(id,type){

    <label class="lab">날씨</label>${wxPicker(weather,'id="leW"')}
    <label class="lab" for="leT">오늘의 한 줄</label><textarea class="ta" id="leT">${esc(l.text||'')}</textarea>
    <label class="lab">사진</label><div class="ph" id="lePh"></div>

    <div class="sp"></div><div class="row"><button class="btn grow" id="leGo">저장</button><button class="btn quiet" id="leNo">취소</button></div>`);
  const drawPh=()=>{const ps=cur();$('#lePh').innerHTML=ps.length?ps.map(p=>`<div style="position:relative"><img src="${esc(mediaUrl(p.path))}" alt=""><button type="button" data-pd="${p.id}" aria-label="이 사진 빼기" style="position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(20,33,61,.75);color:#fff;font-size:15px">✕</button></div>`).join(''):'<p class="small faint">사진이 없어요</p>';
    $$('[data-pd]',$('#lePh')).forEach(b=>b.onclick=()=>{drop.add(b.dataset.pd);drawPh()})};

  $('#leF').onchange=e=>{files=[...e.target.files];$('#leN').textContent=files.length?files.length+'장 더할게요':''};

  };

/* ---- 위치기록 ---- */
const TILE='https://tile.openstreetmap.org/';
const lon2x=(lon,z)=>(lon+180)/360*256*Math.pow(2,z);
const lat2y=(lat,z)=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*256*Math.pow(2,z)};
function fitZoom(pts,W,H,pad=50){
  if(!pts.length)return{z:3,cx:lon2x(-98,3),cy:lat2y(39,3)}; // 미국 전체
  if(pts.length===1)return{z:15,cx:lon2x(pts[0].lng,15),cy:lat2y(pts[0].lat,15)};
  for(let z=17;z>=2;z--){const xs=pts.map(p=>lon2x(p.lng,z)),ys=pts.map(p=>lat2y(p.lat,z));
    const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);
    if(w<=W-pad*2&&h<=H-pad*2)return{z,cx:(Math.max(...xs)+Math.min(...xs))/2,cy:(Math.max(...ys)+Math.min(...ys))/2}}
  return{z:2,cx:lon2x(0,2),cy:lat2y(20,2)};
}
function dayOf(ms){const ds=days();if(!ds.length)return null;const d=new Date(ms);d.setHours(0,0,0,0);const i=ds.findIndex(x=>x.date.getTime()===d.getTime());return i>=0?i:null}
const hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function locs(){return all('loc').filter(l=>isFinite(l.lat)&&isFinite(l.lng)).map(l=>({...l,day:dayOf(l.at)})).sort((a,b)=>a.at-b.at)}
/* 지도: 외부 라이브러리 없이 OpenStreetMap 타일을 직접 깔고 점과 선을 그림 */
function mountMap(el,pts){
  const W=()=>el.clientWidth,H=()=>el.clientHeight;
  let st=fitZoom(pts,W()||360,H()||360),pop=null;
  el.innerHTML='<div class="tiles"></div><svg></svg><div class="over"></div><div class="zoom"><button aria-label="확대">+</button><button aria-label="축소">−</button></div><div class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>'+(pts.length?'':'<div class="empty-map">아직 기록한 곳이 없어요.<br>아래 버튼으로 첫 위치를 남겨 주세요.</div>');
  const tl=el.querySelector('.tiles'),sv=el.querySelector('svg'),ov=el.querySelector('.over');
  function draw(){
    const z=st.z,n=Math.pow(2,z),w=W(),h=H(),ox=st.cx-w/2,oy=st.cy-h/2;
    let html='';const x0=Math.floor(ox/256),x1=Math.floor((ox+w)/256),y0=Math.max(0,Math.floor(oy/256)),y1=Math.min(n-1,Math.floor((oy+h)/256));
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const tx=((x%n)+n)%n;html+=`<img src="${TILE}${z}/${tx}/${y}.png" style="left:${x*256-ox}px;top:${y*256-oy}px" alt="" draggable="false" referrerpolicy="strict-origin-when-cross-origin">`}
    tl.innerHTML=html;
    const P=p=>[lon2x(p.lng,z)-ox,lat2y(p.lat,z)-oy];
    const byDay={};pts.forEach(p=>(byDay[p.day??'x']=byDay[p.day??'x']||[]).push(p));
    sv.innerHTML=Object.values(byDay).map(arr=>arr.length>1?`<polyline points="${arr.map(p=>P(p).join(',')).join(' ')}" fill="none" stroke="#2340E0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9" opacity=".9"/>`:'').join('');
    ov.innerHTML=pts.map((p,i)=>{const [x,y]=P(p);return `<div class="pin ${i===pts.length-1?'last':''}" data-i="${i}" style="left:${x}px;top:${y}px;background:${mcol(member(p.author))}" role="button" aria-label="${esc(p.name||'위치')}"></div>`}).join('')+(pop!=null&&pts[pop]?(()=>{const p=pts[pop],[x,y]=P(p);return `<div class="pop" style="left:${x}px;top:${y}px"><b>${esc(p.name||'이름 없는 곳')}</b><br><span class="muted">${esc(nameOf(p.author))}, ${p.day!=null?(p.day+1)+'일째 ':''}${hhmm(p.at)}</span></div>`})():'');

/* ---- 정산 ---- */
function expenseRows(){
  const ids=members().map(m=>m.id);
  const fromPrep=all('prep').filter(p=>p.expense!==false&&p.cost&&p.payer).map(p=>({id:'p'+p.id,prep:true,day:null,payer:p.payer,amount:Number(p.cost),memo:p.title||PREP[p.type],split:ids}));
  const ex=all('expense').map(e=>({...e,amount:Number(e.amount)||0,split:(e.split||[]).filter(s=>ids.includes(s))})).map(e=>({...e,split:e.split.length?e.split:ids}));
  return [...fromPrep,...ex].sort((a,b)=>((a.day??-1)-(b.day??-1))||((a.created||0)-(b.created||0)));
}
function settle(){
  /* 통화의 가장 작은 단위(센트, 원)로 정수 계산: 나머지는 한 사람씩 1단위씩 나눠서 합이 정확히 맞게 */
  const k=Math.pow(10,curDigits()),bal={},owe={};members().forEach(m=>{bal[m.id]=0;owe[m.id]=0});
  let total=0;
  expenseRows().forEach(e=>{if(!(e.payer in bal))return;const tot=Math.round((Number(e.amount)||0)*k);const sp=e.split.filter(x=>x in bal);if(!sp.length)return;
    bal[e.payer]+=tot;total+=tot;sp.forEach(x=>owe[x]+=tot/sp.length)});
  /* 각자 몫을 여행 전체로 모아서 반올림: 남는 단위는 소수점이 큰 사람부터 1씩 (합이 정확히 맞고, 몫 차이는 최대 1단위) */
  const ids=Object.keys(owe);const fl={};let rest=total;ids.forEach(x=>{fl[x]=Math.floor(owe[x]+1e-9);rest-=fl[x]});
  ids.slice().sort((a,b)=>(owe[b]-fl[b])-(owe[a]-fl[a])||(a<b?-1:1)).forEach(x=>{if(rest>0){fl[x]++;rest--}});
  ids.forEach(x=>bal[x]-=fl[x]);
  const d=Object.entries(bal).filter(x=>x[1]<0).sort((a,b)=>a[1]-b[1]).map(x=>[...x]),c=Object.entries(bal).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>[...x]);
  const tr=[];let i=0,j=0;while(i<d.length&&j<c.length){const a=Math.min(-d[i][1],c[j][1]);tr.push({from:d[i][0],to:c[j][0],amt:a/k});d[i][1]+=a;c[j][1]-=a;if(d[i][1]===0)i++;if(c[j][1]===0)j++}
  Object.keys(bal).forEach(x=>bal[x]=bal[x]/k);
  return{bal,tr};
}

    <div class="block"><div class="total"><b>${won(total)}</b><span class="muted">${ms.length?`한 사람당 평균 ${won(total/ms.length)}`:''}</span></div>
      <h3 style="margin-top:20px">보낼 돈</h3>
      <ul class="xfer">${tr.map(t=>`<li><span class="pair">${face(member(t.from),30)}${face(member(t.to),30)}</span><span class="who2">${esc(nameOf(t.from))}<span>→</span>${esc(nameOf(t.to))}</span><b class="hl num">${won(t.amt)}</b></li>`).join('')||'<li class="muted">아직 보낼 돈이 없어요</li>'}</ul>
      <h3 style="margin-top:22px">사람별</h3>
      <table><thead><tr><th>이름</th><th class="num">낸 돈</th><th class="num">내 몫</th><th class="num">차이</th></tr></thead><tbody>
      ${ms.map(m=>{const paid=rows_.filter(e=>e.payer===m.id).reduce((s,e)=>s+e.amount,0);const b=bal[m.id]||0;return `<tr><td>${esc(m.name)}</td><td class="num">${won(paid)}</td><td class="num">${won(paid-b)}</td><td class="num ${b>=0?'pos':'neg'}">${b>=0?'+':''}${won(b)}</td></tr>`}).join('')}</tbody></table></div>`;
  $('#xGo').onclick=()=>{const amount=Number($('#xA').value),payer=$('#xP').value;if(!amount||!payer){toast('낸 사람과 금액을 넣어 주세요');return}
    const split=$$('.xS:checked',v).map(c=>c.value);if(!split.length){toast('함께 낼 사람을 한 명 이상 골라 주세요');return}
    const d=$('#xD').value;put('expense',uid(8),{day:d===''?null:Number(d),payer,amount,memo:$('#xM').value.trim(),split,created:Date.now(),by:myId||null})};
  $$('[data-xx]',v).forEach(b=>b.onclick=()=>{const e=one('expense',b.dataset.xx);ask(`「${e?.memo||'이 지출'}」 ${won(e?.amount)} 지출을 취소할까요?`,'지출 취소',()=>remove('expense',b.dataset.xx),true,'그대로 두기')});
  bindAuto(v);
}

function wipeRemote(){

    }catch(e){$('#wGo').disabled=false;on(0,'일부를 지우지 못했어요: '+e.message+' 다시 눌러 주세요.')}

  b+=`<section>${chap(1,'사람들')}<div class="people">${ms.map(x=>`<div class="pp">${F(x,92)}<div><h3 style="color:${mcol(x)}">${esc(x.name)}</h3><p class="rl">${esc(x.role||'')}</p>${x.hope?`<p>${esc(x.hope)}</p>`:''}</div></div>`).join('')}</div></section>`;

   --------------------------------------------------------------- */
const UA=navigator.userAgent||'';
const IS_IOS=/iPhone|iPad|iPod/i.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const IS_ANDROID=/Android/i.test(UA);
const INAPP=/KAKAOTALK/i.test(UA)?'kakao':/Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER\(inapp|DaumApps|BAND\//i.test(UA)?'other':null;
const STANDALONE=(()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}})();
const SS={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view==='cover'&&$('#view'))render()});
function openExternal(){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)}
function rInApp(){
  const br=IS_IOS?'Safari':'크롬';
  const where=INAPP==='kakao'?'카카오톡':'이 앱';
  const steps=IS_IOS?[['오른쪽 아래 <b style="display:inline">공유 버튼</b>을 누릅니다','네모에 위쪽 화살표가 있는 모양이에요.'],['<b style="display:inline">Safari로 열기</b>를 고릅니다','Safari가 열리면 비밀번호를 넣고 들어가세요.']]
    :[['오른쪽 아래(또는 위) <b style="display:inline">⋮</b> 버튼을 누릅니다','점 세 개가 세로로 있는 모양이에요.'],['<b style="display:inline">다른 브라우저로 열기</b>를 고릅니다','크롬이 열리면 비밀번호를 넣고 들어가세요.']];
  $('#root').innerHTML=`<main class="welcome">
    <p class="cover-place">여행모아</p>
    <h1 style="font-size:clamp(34px,9vw,52px)">${br}에서<br>열어 주세요</h1>
    <p class="lead">${where} 안에서 열면 홈 화면에 추가할 수 없고, 들어온 기록도 따로 보관돼서 나중에 다시 들어와야 해요.</p>
    <ol class="steps">${steps.map(([t,d])=>`<li><b>${t}</b><p class="muted">${d}</p></li>`).join('')}</ol>
    ${INAPP==='kakao'?`<button class="btn block-w" id="iaTry">${br}로 열기</button><div class="sp"></div>`:''}
    <button class="btn line block-w" id="iaCopy">링크 복사</button>
    <p class="small muted" style="margin-top:8px">복사한 링크를 ${br} 주소창에 붙여넣어도 됩니다.</p>
    <button class="link small" id="iaStay" style="margin-top:22px">그냥 여기서 계속하기</button>
  </main>`;
  const t=$('#iaTry');if(t)t.onclick=openExternal;
  $('#iaCopy').onclick=()=>copyText(location.href);
  $('#iaStay').onclick=()=>{SS.set('tb.stayInApp','1');boot()};
}
function a2hsCard(){
  if(STANDALONE||INAPP||!(IS_IOS||IS_ANDROID)||LS.get('tb.a2hsDone'))return '';
  const how=IS_IOS?'Safari 아래쪽 <b>공유 버튼</b>(네모에 위 화살표)을 누르고 <b>홈 화면에 추가</b>를 고르세요.'
    :installEvt?'아래 버튼을 누르면 바로 추가돼요.':'크롬 오른쪽 위 <b>⋮</b> 메뉴에서 <b>홈 화면에 추가</b>(또는 앱 설치)를 고르세요.';
  return `<div class="block" id="a2hs" style="margin:0 0 22px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start">
    <img src="apple-touch-icon.png" alt="" style="width:52px;height:52px;border-radius:12px">
    <div><b style="font-size:16px">홈 화면에 여행모아 추가하기</b><p class="small muted" style="margin-top:4px">${how}</p>
    <div class="row" style="margin-top:10px">${installEvt?'<button class="btn sm" id="a2hsGo">홈 화면에 추가</button>':''}<button class="btn quiet sm" id="a2hsX">닫기</button></div></div></div>`;
}
function bindA2hs(){
  const x=$('#a2hsX');if(x)x.onclick=()=>{LS.set('tb.a2hsDone',true);$('#a2hs')?.remove()};
  const g=$('#a2hsGo');if(g)g.onclick=async()=>{try{installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;if(r?.outcome==='accepted'){LS.set('tb.a2hsDone',true);toast('홈 화면에 추가했어요')}render()}catch(e){console.warn(e)}};
}

async function boot(){
  if(INAPP&&!SS.get('tb.stayInApp')){
    if(INAPP==='kakao'&&!SS.get('tb.extTried')){
      SS.set('tb.extTried','1');
      $('#root').innerHTML='<main class="welcome"><p class="muted">'+(IS_IOS?'Safari':'크롬')+'로 여는 중…</p></main>';
      openExternal();setTimeout(rInApp,1500);return;
    }
    return rInApp();
  }
  readJoin();
  cfg=LS.get('tb.cfg');
  if(cfg&&cfg.mode==='remote'&&!cfg.tripKey){LS.del('tb.cfg');cfg=null}
  const join=LS.get('tb.join');
  if(join&&!(cfg&&cfg.mode==='remote'&&cfg.salt===join.salt))return rJoin(join);
  if(join)LS.del('tb.join');
  rows.clear();clearInterval(syncTimer);
  if(!cfg){render();return}
  $('#root').innerHTML='<main class="welcome"><p class="muted">불러오는 중…</p></main>';
  if(cfg.mode==='remote'){
    BE=RemoteBackend(cfg);isOwner=!!cfg.adminKey;
    const cache=LS.get('tb.cache.'+cfg.trip);
    if(cache){cache.rows.forEach(r=>rows.set(r.k,r));lastServer=cache.last||0}
    const ob=LS.get(outboxKey(),{});Object.values(ob).forEach(r=>rows.set(r.k,r));
    try{const list=await BE.load();lastServer=0;applyRemote(list);setSync('ok')}catch(e){console.warn(e);setSync('err');if(!cache)toast('인터넷에 연결되지 않아 불러오지 못했어요',4000)}
    syncTimer=setInterval(pull,6000);
  }else{
    BE=LocalBackend;isOwner=true;
    try{(await BE.load()).forEach(r=>rows.set(r.k,r))}catch(e){toast('이 브라우저는 기기 저장을 지원하지 않아요')}
  }
  myId=LS.get('tb.me.'+(cfg.trip||'local'));
  if(cfg.mode==='remote'&&!location.search.includes('j='))keepJoinInUrl();
  try{navigator.storage?.persist?.()}catch(e){}
  $('#root').innerHTML='';render();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
window.addEventListener('online',()=>flush());
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#join=')){boot();return}const h=location.hash.slice(1);if(h&&h!==view&&(CHAPS.some(c=>c.k===h)||h==='share')){view=h;render()}});
boot();
</script>
</body>
</html>
